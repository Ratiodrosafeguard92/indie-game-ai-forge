[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "indie-game-ai-forge"
version = "0.6.3"
description = "AI full indie game generator: prompt in, playable project out (pipeline/worker)."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "forge-crew" }]
keywords = ["indie", "game", "generator", "ai", "pipeline", "godot", "unity"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Code Generators",
]

dependencies = [
  "pydantic>=2.7,<3",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
]
native = []  # C++ bridge is built via CMake, not pip

[project.scripts]
forge = "forge_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_cli", "src/forge_core", "src/forge_ingest",
            "src/forge_processors", "src/forge_output", "src/forge_models",
            "src/forge_utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"